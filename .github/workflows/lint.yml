name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public RPC bind addresses
        run: python -m unittest discover --start-directory tests --verbose
      - uses: pre-commit/action@v3.0.1
